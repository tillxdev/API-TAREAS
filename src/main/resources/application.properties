spring.datasource.url=jdbc:mysql://127.0.0.1:3306/proyecto01
spring.datasource.username=root
spring.datasource.password=test
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Para que si hay cambios en el entity lo haga update
spring.jpa.hibernate.ddl-auto=update
#  para mostrar las consultas generadas por hibernate en consola
spring.jpa.show-sql=true
#  Dialecto forma de comunicarse con la bd
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect